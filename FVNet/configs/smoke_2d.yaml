# Tiny CPU-friendly config used by tests / `make smoke` with scripts/make_synthetic_data.py --dim 2
dim: 2
out: runs/smoke_2d
data: {root: data/synth2d, layout: flat, image_dir: images, label_dir: labels, cache: runs/smoke_2d/cache}
preprocess: {clahe: true, sigmas: [1.0, 1.5, 2.0]}
model: {filters: [8, 16, 32, 64]}
train: {patch: [64, 64], batch: 2, epochs: 2, iters: 3, full_val_every: 1, n_val_patches: 2, amp: false}
infer: {roi: [64, 64]}
test: {tta: false, n_slices: 3, min_cc: 5}
